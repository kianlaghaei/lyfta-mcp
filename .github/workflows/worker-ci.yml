name: Cloudflare personal worker CI

on:
  push:
    branches: [feat/cloudflare-personal-mcp]
    paths: ['worker/**', '.github/workflows/worker-ci.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
